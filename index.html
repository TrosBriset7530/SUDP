<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4EBE3" />
  <title>PaperCycle – Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <main class="view">
      <div class="top-tabs">
        <button class="tab active" data-tab="progress">Progress</button>
        <button class="tab" data-tab="history">History</button>
      </div>

      <section id="tab-progress" class="tab-panel active">
        <div class="card">
          <p class="muted">Hello, <span id="userName">Guest</span></p>
          <h1><span id="totalSheets">0</span> <small>sheets recycled</small></h1>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
          <p class="muted"><span id="levelText">Level 1</span> · <span id="toNext">100</span> sheets to next level</p>
        </div>

        <div class="stats">
          <div class="card small"><p class="muted">Points</p><h2 id="points">0</h2></div>
          <div class="card small"><p class="muted">Drop-offs</p><h2 id="dropCount">0</h2></div>
          <div class="card small"><p class="muted">Trees saved*</p><h2 id="trees">0</h2></div>
        </div>
        <p class="footnote">*Estimate: ~8,000 sheets ≈ 1 tree. Prototype data only.</p>
      </section>

      <section id="tab-history" class="tab-panel">
        <ul id="historyList" class="history"></ul>
        <p id="historyEmpty" class="muted center">No drop-offs yet. Tap the scan button to start.</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <nav class="nav">
      <a class="nav-btn active" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
      </a>
      <a class="nav-btn" href="scan.html" aria-label="Scan">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>
          <path d="M8 12h8"/>
        </svg>
      </a>
      <a class="nav-btn" href="menu.html" aria-label="Menu">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.6" rx="1"/><rect x="3" y="10.7" width="18" height="2.6" rx="1"/><rect x="3" y="16.4" width="18" height="2.6" rx="1"/></svg>
      </a>
    </nav>
  </div>

  <script src="common.js"></script>
  <script src="home.js"></script>
</body>
</html>
