<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4EBE3" />
  <title>PaperCycle – Scan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <main class="view">
      <h2 class="title">Scan Vending Machine</h2>

      <!-- Step A: scan QR -->
      <div id="scanStep">
        <div class="camera-box">
          <video id="video" playsinline muted></video>
          <div class="frame"></div>
          <p id="cameraMsg" class="camera-msg">Camera is off</p>
        </div>
        <div class="row">
          <button id="btnCamera" class="btn">Start camera</button>
          <button id="btnSimulate" class="btn ghost">Simulate scan</button>
        </div>
        <form id="manualForm" class="manual">
          <input id="manualCode" placeholder="Or type code, e.g. PAPERVEND:VM-001" autocomplete="off" />
          <button class="btn" type="submit">Go</button>
        </form>
      </div>

      <!-- Step B: mesin terhubung -->
      <div id="sessionStep" hidden>
        <div class="card">
          <p class="muted">Connected to</p>
          <h2 id="machineId">VM-001</h2>
          <p id="machineStatus" class="status">Ready – insert your unused paper</p>
        </div>
        <div class="row">
          <button id="btnDrop" class="btn">Simulate paper drop</button>
          <button id="btnEnd" class="btn ghost">End session</button>
        </div>
        <div id="resultCard" class="card result" hidden></div>
      </div>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <nav class="nav">
      <a class="nav-btn" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
      </a>
      <a class="nav-btn active" href="scan.html" aria-label="Scan">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>
          <path d="M8 12h8"/>
        </svg>
      </a>
      <a class="nav-btn" href="menu.html" aria-label="Menu">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.6" rx="1"/><rect x="3" y="10.7" width="18" height="2.6" rx="1"/><rect x="3" y="16.4" width="18" height="2.6" rx="1"/></svg>
      </a>
    </nav>
  </div>

  <script src="common.js"></script>
  <script src="scan.js"></script>
</body>
</html>
